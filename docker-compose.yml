# Storefront público multi-tenant (una SPA para todos los dominios).
#
# Local (API en el host):
#   docker network create nginx-proxy-manager_default   # solo la primera vez
#   API_UPSTREAM=http://host.docker.internal:5088 docker compose up -d --build
#
# Producción: apunta API_UPSTREAM al API de EcuNexo del entorno
#   (ej. http://api:8080 si comparte red con el stack del cliente).
# El contenedor se une automáticamente a la red de Nginx Proxy Manager
# (nginx-proxy-manager_default) para que NPM lo resuelva por nombre tras cada redeploy.
name: ecunexo-storefront

services:
  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${STOREFRONT_API_BASE_URL:-}
        VITE_TENANT_ID: ${STOREFRONT_TENANT_ID:-}
        VITE_STORE_NAME: ${STOREFRONT_STORE_NAME:-}
    image: ${STOREFRONT_IMAGE:-ecunexo-storefront:1.0.0}
    pull_policy: build
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:5088}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${STOREFRONT_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - npm_network

networks:
  default:
  # Red del Nginx Proxy Manager del VPS; debe existir (external).
  npm_network:
    external: true
    name: nginx-proxy-manager_default
